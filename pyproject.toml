[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cogcore"
version = "0.1.0"
description = "通用认知内核 - LLM Agent 的持续认知层"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "gkd2323c" },
]
dependencies = [
    "pydantic>=2.5",
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
]

[project.scripts]
cogcore = "cogcore.serve:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
python_files = ["test_*.py"]
markers = [
    "evals: opt-in evaluation tests",
]
