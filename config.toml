# CogCore 配置文件
# 路径：项目根目录 config.toml
# 格式：TOML（Python 3.11+ 原生支持，无需额外依赖）

[llm]
# API 协议类型：openai | ollama
# openai = OpenAI 标准 /v1/chat/completions 协议
# ollama = Ollama 原生协议（不含 /v1 前缀）
api_type = "openai"

# API 端点
# OpenAI 兼容: http://localhost:11434/v1（Ollama 也兼容此格式）
# 远程服务: https://api.openai.com/v1
endpoint = "http://localhost:11434/v1"

# API Key（本地服务留空，远程服务必填）
# api_key = "sk-..."

# 模型名称
# 本地 Ollama: qwen3:8b / llama3.2:3b 等
# OpenAI: gpt-4o / gpt-4o-mini 等
model = "qwen3:8b"

# 生成参数
temperature = 0.7
max_tokens = 4096
timeout = 60

# 对话循环最大轮数（防止死循环）
max_turns = 10

# 是否启用流式输出
stream = false

[persistence]
# 持久化后端：memory | postgres | sqlite
backend = "memory"

# Postgres 连接字符串（backend=postgres 时生效）
# postgres_uri = "postgresql://cogcore:cogcore@localhost:5432/cogcore"

# SQLite 路径（backend=sqlite 时生效）
# sqlite_path = "cogcore.db"

[runtime]
# 日志级别：DEBUG | INFO | WARNING | ERROR
log_level = "INFO"

# 默认模式：full_silent | ap_agency | reinforced_agency
mode = "full_silent"
